<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapView Editor</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --bg3: #0f3460;
  --fg: #e0e0e0;
  --fg2: #a0a0b0;
  --accent: #00838f;
  --accent2: #4dd0e1;
  --danger: #e74c3c;
  --danger-hover: #c0392b;
  --success: #27ae60;
  --border: #2a2a4a;
  --device: #4dd0e1;
  --device-selected: #ffd700;
  --zone-fill: rgba(0,131,143,0.15);
  --zone-stroke: #00838f;
  --zone-selected-fill: rgba(255,215,0,0.15);
  --zone-selected-stroke: #ffd700;
  --font: 'Segoe UI', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* Top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
.topbar .spacer { flex: 1; }
.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg3);
  color: var(--fg);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn:hover { background: var(--accent); }
.btn.danger { border-color: var(--danger); }
.btn.danger:hover { background: var(--danger); }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { background: #006974; }

/* Main layout */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 280px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-header h2 { font-size: 13px; font-weight: 600; flex: 1; }
.map-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.map-group-header {
  padding: 8px 12px 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent2);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.map-item {
  padding: 7px 12px 7px 20px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.1s;
  position: relative;
}
.map-item:hover { background: rgba(255,255,255,0.05); }
.map-item.active { background: var(--bg3); color: var(--accent2); }
.map-item .map-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-item .map-stats { font-size: 11px; color: var(--fg2); }
.map-item .map-delete {
  opacity: 0;
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
}
.map-item:hover .map-delete { opacity: 0.6; }
.map-item .map-delete:hover { opacity: 1; }

/* Editor area */
.editor {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.toolbar .sep {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 4px;
}
.tool-btn {
  padding: 5px 10px;
  border: 1px solid transparent;
  border-radius: 3px;
  background: none;
  color: var(--fg2);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.1s;
  white-space: nowrap;
}
.tool-btn:hover { background: rgba(255,255,255,0.08); color: var(--fg); }
.tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.toolbar .info { font-size: 12px; color: var(--fg2); margin-left: auto; }

/* Canvas container */
.canvas-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  cursor: default;
}
.canvas-inner {
  position: absolute;
  transform-origin: 0 0;
}
.canvas-inner img {
  display: block;
  image-rendering: auto;
}
.canvas-inner svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
}
.canvas-inner svg .zone-poly {
  fill: var(--zone-fill);
  stroke: var(--zone-stroke);
  stroke-width: 2;
  pointer-events: all;
  cursor: pointer;
}
.canvas-inner svg .zone-poly.selected {
  fill: var(--zone-selected-fill);
  stroke: var(--zone-selected-stroke);
  stroke-width: 3;
}
.canvas-inner svg .zone-poly:hover {
  fill: rgba(0,131,143,0.25);
}
.canvas-inner svg .zone-vertex {
  fill: var(--zone-stroke);
  stroke: #fff;
  stroke-width: 1.5;
  cursor: move;
  pointer-events: all;
}
.canvas-inner svg .zone-vertex.selected {
  fill: var(--device-selected);
}
.canvas-inner svg .device-marker {
  pointer-events: all;
  cursor: pointer;
}
.canvas-inner svg .device-dot {
  fill: var(--device);
  stroke: #fff;
  stroke-width: 1.5;
}
.canvas-inner svg .device-dot.selected {
  fill: var(--device-selected);
  stroke: var(--device-selected);
  stroke-width: 2;
}
.canvas-inner svg .draw-preview {
  fill: rgba(0,131,143,0.1);
  stroke: var(--accent2);
  stroke-width: 2;
  stroke-dasharray: 6 3;
}

/* Properties panel */
.props-panel {
  width: 260px;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  flex-shrink: 0;
  overflow-y: auto;
  padding: 12px;
  display: none;
}
.props-panel.visible { display: block; }
.props-panel h3 {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.props-panel label {
  display: block;
  font-size: 12px;
  color: var(--fg2);
  margin-bottom: 3px;
}
.props-panel input, .props-panel select {
  width: 100%;
  padding: 5px 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--fg);
  font-size: 13px;
  margin-bottom: 10px;
}
.props-panel .prop-row {
  display: flex;
  gap: 8px;
}
.props-panel .prop-row > div { flex: 1; }

/* Welcome / empty state */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--fg2);
}
.empty-state h2 { font-size: 20px; color: var(--fg); font-weight: 400; }
.empty-state p { font-size: 14px; max-width: 400px; text-align: center; line-height: 1.5; }
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent2);
}
.drop-zone input { display: none; }

/* Toast notifications */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 18px;
  background: var(--bg3);
  border: 1px solid var(--accent);
  border-radius: 4px;
  font-size: 13px;
  color: var(--fg);
  z-index: 1000;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
}
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  min-width: 360px;
  max-width: 480px;
}
.modal h3 { font-size: 16px; margin-bottom: 16px; }
.modal label { display: block; font-size: 13px; color: var(--fg2); margin-bottom: 4px; }
.modal input, .modal select {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--fg);
  font-size: 14px;
  margin-bottom: 14px;
}
.modal .modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg3); }

/* Tooltip */
.device-tooltip {
  position: fixed;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 11px;
  color: var(--accent2);
  pointer-events: none;
  z-index: 100;
  font-family: monospace;
  white-space: nowrap;
}
</style>
</head>
<body>

<div class="topbar">
  <h1>MapView Editor</h1>
  <span id="versionBadge" title="" style="font-size:11px;color:var(--fg2);font-family:monospace;cursor:default"></span>
  <span class="spacer"></span>
  <span id="statusText" style="font-size:12px;color:var(--fg2)"></span>
  <button class="btn primary" id="btnExport" style="display:none">Export .mvdb</button>
</div>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar" style="display:none">
    <div class="sidebar-header">
      <h2>Maps</h2>
      <button class="btn" id="btnAddMap" title="Add new map">+ Add</button>
    </div>
    <div class="map-list" id="mapList"></div>
  </div>

  <!-- Editor / Welcome -->
  <div class="editor" id="editorArea">
    <div class="empty-state" id="welcomeScreen">
      <h2>MapView Editor</h2>
      <p>Load a .mvdb export from SensorView to edit floorplans, devices, and zones.</p>
      <div class="drop-zone" id="dropZone">
        <p>Drop .mvdb file here or click to browse</p>
        <input type="file" id="fileInput" accept=".mvdb">
      </div>
    </div>

    <!-- Toolbar (hidden until map loaded) -->
    <div class="toolbar" id="toolbar" style="display:none">
      <button class="tool-btn active" data-tool="select">Select</button>
      <button class="tool-btn" data-tool="move-device">Move Device</button>
      <button class="tool-btn" data-tool="add-device">Add Device</button>
      <span class="sep"></span>
      <button class="tool-btn" data-tool="draw-zone">Draw Zone</button>
      <button class="tool-btn" data-tool="edit-zone">Edit Zone</button>
      <span class="sep"></span>
      <button class="tool-btn" id="btnReplaceImage">Replace Image</button>
      <input type="file" id="imageInput" accept="image/png,image/jpeg" style="display:none">
      <button class="tool-btn" id="btnDeleteSelected" style="display:none">Delete Selected</button>
      <span class="info" id="toolInfo"></span>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrap" id="canvasWrap" style="display:none">
      <div class="canvas-inner" id="canvasInner">
        <img id="floorplanImg" alt="Floorplan">
        <svg id="overlaySvg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </div>

  <!-- Properties panel -->
  <div class="props-panel" id="propsPanel">
    <!-- Filled dynamically -->
  </div>
</div>

<div class="device-tooltip" id="tooltip" style="display:none"></div>

<script src="/static/editor.js"></script>
</body>
</html>
