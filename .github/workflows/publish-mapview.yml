# Publishes mapview-editor to PyPI when a mapview-editor-v* tag is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no tokens stored in the repo.
# One-time setup on pypi.org: add a "pending publisher" for project
# mapview-editor -> owner scriMillspaugh, repo sensorview-toolkit,
# workflow publish-mapview.yml, environment pypi.
name: publish-mapview

on:
  push:
    tags: ["mapview-editor-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        working-directory: mapview-editor
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mapview-editor-v}"
          PKG_VERSION="$(python -c 'import ast,pathlib
for node in ast.walk(ast.parse(pathlib.Path("mapview_editor/server.py").read_text(encoding="utf-8"))):
    if isinstance(node, ast.Assign) and node.targets[0].id == "__version__":
        print(node.value.value); break')"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"
      - name: Build sdist and wheel
        working-directory: mapview-editor
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: mapview-editor/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
